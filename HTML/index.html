<!DOCTYPE html>
<html lang="en">
  <!-- opening of the html code -->
  <head>
    <!-- The head part which is response of the title -->
    <title>My First Web Page</title>
    <!-- title part -->
    <!--css rules -->
    <style>
      img {
        width: 100px;
        border-radius: 50px;
        float: left;
        margin-right: 10px;
      }

      .username {
        font-weight: bold;
      }
    </style>
  </head>
  <!-- close head -->
  <body>
    <!-- Start of the body content -->
    <img src="Images/OIP-3233055677.jpg" alt="a sky image" />
    <!-- here we put images in the src attribute with its path -->
    <p class="username">@Sky</p>
    <!-- here we write paragraph -->
    <p>What a beautiful sky</p>
  </body>
  <!-- End of the body content -->
</html>
<!-- closing of the html code -->
