<!DOCTYPE html>
<html lang="en">
  <!-- opening of the html code -->
  <head>
    <!-- The head part which is response of the title -->
    <title>My First Web Page</title>
    <!-- title part -->
    <!--css rules -->
    <style>
      img {
        width: 100px;
        border-radius: 50px;
        float: left;
        margin-right: 10px;
      }

      .username {
        font-weight: bold;
      }

      em{
        color: red;
        font-style: normal;
      }
    </style>
  </head>
  <!-- close head -->
  <body>
    <!-- Start of the body content -->
    <img src="Images/OIP-3233055677.jpg" alt="a sky image" />
    <!-- here we put images in the src attribute with its path -->
    <p class="username">@Sky</p>
    <!-- here we write paragraph -->
    <p>What a beautiful sky</p>
    <!--emphasis the elements inside P-->
    <p>I love <em>Sky</em></p>
    <h2 id="Image">Image</h2>
    <!--There is 6 Headings-->
    <h1>heading 1</h1>
    <h2>heading 2</h2>
    <h3>heading 3</h3>
    <h4>heading 4</h4>
    <h5>heading 5</h5>
    <h6>heading 6</h6>

    <!--HyperLinks-->
    <a href="test.html">test</a>
    <h2 id="Image">Image</h2>
    <a href="#Image">Image</a>
    <a href="test.html" download>
      <img src="Images/OIP-3233055677.jpg" alt="a sky image">
    </a>
    <a href="https://google.com" target="_blank">google</a>
    <a href="mailto:omar.heshamd@gmail.com">email me</a>
  </body>
  <!-- End of the body content -->
</html>
<!-- closing of the html code -->
